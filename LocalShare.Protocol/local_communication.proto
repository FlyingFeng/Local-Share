syntax = "proto3";
package LocalShare.Protocol.Define;


enum FileTaskStatus{
	FILE_TASK_STATUS_SUCCESS   = 0;   //成功
	FILE_TASK_STATUS_FAILED    = 1;   //失败
	FILE_TASK_STATUS_PAUSED    = 3;   //暂停
	FILE_TASK_STATUS_CANCELLED = 4;   //取消
	FILE_TASK_STATUS_SENDING   = 5;   //发送中



	FILE_TASK_STATUS_IN_BLACK_LIST       = 50;   //在黑名单中
	FILE_TASK_STATUS_NOT_IN_WHITE_LIST   = 51;   //不在白名单中
	FILE_TASK_STATUS_PASSWORD_ERROR      = 52;   //密码错误	
}


message EmptyMessage{

}

message CommonResponse{
	bool success   = 1;
	string message = 2;
}

message FileOperationRequest{
	string send_node_name        = 1;
	string task_id               = 2;
	string file_name             = 3;
	int32  operation_type        = 4;   //0:暂停    1:继续    2:取消
}


message NodeModel{
	string node_name         = 1;  //向外广播自身的节点名称
	string ip_address        = 2;   //ip地址
	string machine_name      = 3;
	int32 port               = 4;
	int64 time               = 5;
}


message FileMetaData{
	string task_id          = 1;   //唯一标识
	string file_name        = 2;   //文件名称，带后缀
	string file_ext         = 3;   //文件后缀
	int64  total_size       = 4;   //文件总大小
	int32  chunk_size       = 5;   //每次传输的分片大小
	string md5              = 6;   //文件md5值
	string relative_path    = 7;   //相对路径（目录传输时使用）：subdir/doc.pdf
}

message StartFileTaskRequest{
	FileMetaData file_meta_data     = 1;   //文件元数据
	int64  start_byte_index         = 2;   //从哪个字节开始传输（断点续传时使用）
	string password                 = 3;  //传输密码（如果需要）
}


message StartFileTaskResponse{
	string task_id             = 1;   //唯一标识
	string file_name           = 2;   //文件名称，带后缀
	int64  start_byte_index    = 3;   //从哪个字节开始传输（断点续传时使用）
	FileTaskStatus status      = 4;
}

message PreStartFileTaskRequest{
	string send_node_name    = 1; //发送方节点名称
	string receive_node_name = 2; //接收方节点名称
	string task_id           = 3;
	string send_node_ip      = 4;
}

message PreStartFileTaskResponse{
	bool need_password          = 1;
	FileTaskStatus status       = 2;
	string         task_id      = 3;
}


message FileChunk{
	//string task_id          = 1;  //对应FileMetaData.task_id
	bytes  data             = 1;  //分片二进制数据
}




service LocalShareService{
	rpc GetServerNodeInfo(EmptyMessage) returns(NodeModel);
	rpc PreStartFileTask(PreStartFileTaskRequest) returns(PreStartFileTaskResponse);
	rpc StartFileTask(StartFileTaskRequest) returns(StartFileTaskResponse);
	rpc SendFile(stream FileChunk) returns(EmptyMessage);
	rpc DownloadFile(EmptyMessage) returns(stream FileChunk);
	rpc OperateFileTask(FileOperationRequest) returns(CommonResponse);
}